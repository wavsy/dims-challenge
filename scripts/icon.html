<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap">
<style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#0E0E1E}
.tile{position:relative;width:512px;height:512px;background:linear-gradient(135deg,#FF7A45 0%,#FF3D77 55%,#8B7CFF 100%);display:flex;align-items:center;justify-content:center}
.tile::after{content:"";position:absolute;right:-20%;bottom:-45%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.32),transparent 65%)}
.d{font:800 340px/1 Outfit,Avenir Next,Helvetica,Arial,sans-serif;color:#fff;letter-spacing:-.04em;transform:translateY(-10px);text-shadow:0 12px 40px rgba(0,0,0,.25)}
.bolt{position:absolute;right:88px;bottom:96px;width:92px;height:92px}
</style></head><body>
<div class="tile"><div class="d">D</div>
<svg class="bolt" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/></svg>
</div></body></html>
